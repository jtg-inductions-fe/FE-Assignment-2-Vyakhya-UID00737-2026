<mat-form-field class="dropdown" appearance="outline" floatLabel="always">
  <mat-label class="dropdown__label"> {{ label }} </mat-label>
  <mat-select
    class="dropdown__select"
    panelClass="dropdown-panel"
    [value]="selectedValue"
    (selectionChange)="onSelectionChange($event.value)"
  >
    <mat-option
      *ngFor="let option of options"
      class="dropdown__option"
      [value]="option.value"
    >
      {{ option.label }}
    </mat-option>
  </mat-select>
</mat-form-field>
