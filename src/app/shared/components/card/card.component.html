<mat-card class="card" appearance="outlined">
  <mat-card-header>
    <h3 class="card__heading card-heading">{{ heading }}</h3>
  </mat-card-header>
  <mat-card-content class="card__records">
    <div class="card__record-list" *ngFor="let item of details">
      <img *ngIf="item.avatar" class="card__avatar" [src]="item.avatar" [alt]="item.name" />
      <div class="card__info">
        <h4 class="card__name p-card-main">{{ item.name }}</h4>
        <p *ngIf="item.subName" class="card__subname p-card">{{ item.subName }}</p>
      </div>
      <h4 class="card__count p-card-main">{{ item.count }}</h4>
    </div>
    <div *ngIf="!details || details.length===0" class="card__no-data">
      <p>No data available!</p>
    </div>
  </mat-card-content>
</mat-card>
