<mat-form-field class="form-input" appearance="outline" [class.form-input--error]="showError">
  <mat-label>{{ label }}</mat-label>
  <input
    matInput
    class="form-input__field input-field-primary"
    [id]="inputId"
    [type]="type"
    [placeholder]="placeholder"
    [formControl]="control" />

  <mat-error class="form-input__error p-report-card" *ngIf="showError">
    {{ errorMessage }}
  </mat-error>
</mat-form-field>
